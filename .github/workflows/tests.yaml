name: Tests

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  schedule:
    - cron: "59 23 * * 3"

jobs:
  Linting:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
      - uses: pre-commit/action@v3.0.1

  unittests:
    name: ${{ matrix.os }}, ${{ matrix.environment-file }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        environment-file: [ci/latest.yaml]
    env:
      TOKEN: ${{ secrets.TOKEN }}

    steps:
      - name: checkout repo
        uses: actions/checkout@v5

      - name: setup micromamba
        uses: mamba-org/setup-micromamba@v2.0.7
        with:
          environment-file: ${{ matrix.environment-file }}
          micromamba-version: "latest"

      - name: Install udlai
        shell: bash -l {0}
        run: pip install .
        if: matrix.os != 'windows-latest'

      - name: Install udlai
        shell: powershell
        run: pip install .
        if: matrix.os == 'windows-latest'

      - name: run tests - bash
        shell: bash -l {0}
        run: pytest -v . --cov=udlai --cov-append --cov-report term-missing --cov-report xml --color=yes
        if: matrix.os != 'windows-latest'

      - name: run tests - bash
        shell: powershell
        run: pip3 install pytest pytest-cov shapely; pytest -v . --cov=udlai --cov-append --cov-report term-missing --cov-report xml --color=yes
        if: matrix.os == 'windows-latest'

      - uses: codecov/codecov-action@v5
